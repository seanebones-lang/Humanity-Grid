[project]
name = "open-results"
version = "0.1.0"
description = "Public data portal and reproducible analyses for Humanity Grid"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "NextEleven", email = "sean@nexteleven.com"}
]
keywords = ["open-science", "data-portal", "reproducibility", "jupyter", "quarto", "fastapi"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "rich>=13.9",
    "loguru>=0.7",
    "polars>=1.10",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "boto3>=1.35",
    "minio>=7.2",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "quarto>=1.5",  # For notebook generation
    "nbconvert>=7.16",
    "nbformat>=5.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=6.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
s3 = [
    "boto3>=1.35",
]
gcs = [
    "google-cloud-storage>=2.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "W", "C4", "N", "D", "TRY", "PD", "PG", "PYI", "T20"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D107", "TRY003"]
fixable = ["F", "I", "UP", "W", "C4", "D", "TRY", "PD", "PG", "PYI", "T20"]
format.quote-style = "double"
format.indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"