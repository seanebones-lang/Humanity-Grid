[package]
name = "humanity-grid-volunteer"
version = "0.1.0"
edition = "2021"
description = "Humanity Grid Volunteer App - Donate idle compute to scientific research"
authors = ["NextEleven <sean@nexteleven.com>"]
license = "MIT"
repository = "https://github.com/seanebones-lang/Humanity-Grid"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macros", "tray-icon", "notification", "dialog", "fs", "shell", "process", "updater", "clipboard-manager", "global-shortcut", "http", "websocket", "sql"] }
tauri-plugin-opener = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.30"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "uuid", "migrate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
dirs = "5"
notify = "6"
async-trait = "0.1"